# Example configuration for whyis_agentic plugin

# Basic agent configuration
agents:
  - name: "qa_agent"
    provider: "github"
    model: "gpt-4"
    system_prompt: "You are a helpful assistant that answers questions about knowledge graphs and semantic web technologies."
    temperature: 0.7
    max_tokens: 1000

  - name: "research_agent"
    provider: "github"
    model: "gpt-4"
    system_prompt: "You are a research assistant that helps find and synthesize information."
    temperature: 0.5
    max_tokens: 2000

# Default provider
default_provider: "github"

# API keys (preferably set via environment variables)
api_keys:
  github: "${GITHUB_TOKEN}"

# Dialog agent settings
dialog:
  enabled: true
  listen_to_stream: true
  auto_reply: true
  record_thinking: true

# Backend compaction settings
backend_compaction:
  enabled: true
  check_interval: 60  # seconds
  max_concurrent_agents: 3
